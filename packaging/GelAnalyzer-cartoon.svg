<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Gel Analyzer — annotated gel</title>
  <desc id="description">A three-dimensional cartoon agarose gel in icy blue, with recessed loading wells, a DNA ladder, and horizontal sample bands. An orange pencil is finishing a handwritten annotation box connected to a small note.</desc>
  <defs>
    <linearGradient id="gel-face" x1="73" y1="68" x2="393" y2="403" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5F8FF"/><stop offset=".5" stop-color="#DFEAFC"/><stop offset="1" stop-color="#C0D4F3"/>
    </linearGradient>
    <linearGradient id="gel-front" x1="145" y1="391" x2="145" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ABC5EE"/><stop offset="1" stop-color="#7799D0"/>
    </linearGradient>
    <linearGradient id="gel-side" x1="420" y1="190" x2="454" y2="195" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7697D0"/><stop offset="1" stop-color="#4D6EA8"/>
    </linearGradient>
    <linearGradient id="well-depth" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#586F9C"/><stop offset=".48" stop-color="#91AAD4"/><stop offset="1" stop-color="#B4C9EB"/>
    </linearGradient>
    <linearGradient id="pencil-barrel" x1="-13" y1="0" x2="13" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E98A34"/><stop offset=".42" stop-color="#FFCD72"/><stop offset="1" stop-color="#F1A13E"/>
    </linearGradient>
  </defs>

  <!-- Offset right and front faces give the slab its thickness. -->
  <path d="M86 55H397C414 55 424 62 435 76L447 94C451 100 453 110 453 119V406C453 424 439 438 421 438H108C96 438 88 433 79 423L61 404C53 395 50 385 50 371V88C50 69 65 55 86 55Z" fill="url(#gel-front)" stroke="#273650" stroke-width="10" stroke-linejoin="round"/>
  <path d="M397 55C414 55 424 62 435 76L447 94C451 100 453 110 453 119V406C453 419 447 430 437 435L408 401C419 396 424 387 424 373V87C424 67 414 55 397 55Z" fill="url(#gel-side)"/>
  <path d="M408 401L437 435" stroke="#273650" stroke-width="5" stroke-linecap="round"/>
  <path d="M106 419H408" stroke="#C2D5F4" stroke-width="6" stroke-linecap="round"/>

  <!-- Keep the top face square to the viewer so the bands remain level. -->
  <rect x="50" y="55" width="374" height="350" rx="32" fill="url(#gel-face)" stroke="#273650" stroke-width="10"/>
  <path d="M69 87C69 78 75 73 86 73H389" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
  <path d="M68 133V366C68 380 73 386 88 386H387" stroke="#AAC3E8" stroke-width="6" stroke-linecap="round" opacity=".65"/>
  <path d="M404 133V363" stroke="#F8FAFF" stroke-width="5" stroke-linecap="round" opacity=".75"/>

  <!-- Dark inner lips and light lower rims suggest recessed loading wells. -->
  <g fill="url(#well-depth)" stroke="#35496C" stroke-width="4">
    <rect x="80" y="102" width="29" height="17" rx="6"/>
    <rect x="126" y="102" width="29" height="17" rx="6"/>
    <rect x="172" y="102" width="29" height="17" rx="6"/>
    <rect x="218" y="102" width="29" height="17" rx="6"/>
    <rect x="264" y="102" width="29" height="17" rx="6"/>
    <rect x="310" y="102" width="29" height="17" rx="6"/>
    <rect x="356" y="102" width="29" height="17" rx="6"/>
  </g>
  <path d="M85 124H104M131 124H150M177 124H196M223 124H242M269 124H288M315 124H334M361 124H380" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity=".9"/>

  <!-- The reference ladder and two groups of three, now horizontal. -->
  <g fill="#3C5485">
    <rect x="81" y="163" width="27" height="10" rx="5"/>
    <rect x="81" y="188" width="27" height="10" rx="5"/>
    <rect x="80" y="212" width="29" height="11" rx="5.5"/>
    <rect x="78" y="237" width="33" height="17" rx="7"/>
    <rect x="81" y="273" width="27" height="10" rx="5"/>
    <rect x="81" y="297" width="27" height="10" rx="5"/>
    <rect x="81" y="324" width="27" height="10" rx="5"/>
    <rect x="80" y="353" width="29" height="11" rx="5.5"/>
    <rect x="124" y="237" width="33" height="17" rx="7"/>
    <rect x="170" y="237" width="33" height="17" rx="7"/>
    <rect x="216" y="237" width="33" height="17" rx="7"/>
    <rect x="262" y="321" width="33" height="12" rx="6"/>
    <rect x="308" y="321" width="33" height="12" rx="6"/>
    <rect x="354" y="321" width="33" height="12" rx="6"/>
  </g>
  <g fill="#96AED8">
    <rect x="264" y="182" width="29" height="9" rx="4.5"/>
    <rect x="310" y="182" width="29" height="9" rx="4.5"/>
    <rect x="356" y="182" width="29" height="9" rx="4.5"/>
  </g>

  <!-- A handwritten note and leader identify the selected band group. -->
  <path d="M302 269C294 282 282 283 282 304" stroke="#D67A2D" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M276 298L282 306L288 298" stroke="#D67A2D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="275" y="226" width="105" height="44" rx="12" fill="#7697D0" opacity=".18"/>
  <path d="M286 220L363 221C370 221 375 226 375 232L374 251C374 259 369 264 361 264L286 263C278 263 273 258 273 251L274 233C274 225 278 220 286 220Z" fill="#FFF6E8" stroke="#D67A2D" stroke-width="4" stroke-linejoin="round"/>
  <path d="M287 235C300 233 312 236 325 235L359 236M287 249C301 247 315 250 338 248" stroke="#BD692B" stroke-width="4" stroke-linecap="round"/>

  <!-- The box is visibly unfinished where the pencil is drawing. -->
  <path d="M402 318V315C402 308 398 306 391 306L264 307C257 307 253 311 253 318L254 338C254 345 258 349 266 349L403 347" stroke="#F0983D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M410 353L434 336L489 255C494 248 486 239 478 244L420 327Z" fill="#344A77" opacity=".13"/>

  <!-- Pencil tip meets the unfinished annotation stroke exactly. -->
  <g transform="translate(403 347) rotate(35)" stroke="#273650" stroke-width="4.5" stroke-linejoin="round">
    <path d="M-13-108V-121C-13-128-8-132 0-132S13-128 13-121V-108Z" fill="#EAA7A1"/>
    <path d="M-13-108H13V-27L0 0L-13-27Z" fill="url(#pencil-barrel)"/>
    <path d="M-13-27L0 0L13-27Z" fill="#FFE5BB"/>
    <path d="M-5-10L0 0L5-10Z" fill="#273650" stroke-width="2"/>
    <path d="M-13-108H13V-97H-13Z" fill="#DCE5F3"/>
    <path d="M-4-88V-35" stroke="#FFF0C5" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g stroke="#E89946" stroke-width="4" stroke-linecap="round">
    <path d="M417 359L426 366M403 365L404 375"/>
  </g>
</svg>
