[project]
name = "agarose-gel-analyzer"
version = "1.0.2"
description = "Local gel image analysis and annotation for macOS and the browser."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2,<3",
    "pillow>=11,<13",
    "streamlit>=1.65,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10"]
desktop = ["pywebview>=6,<7; sys_platform == 'darwin'"]
build = ["pyinstaller>=6.16,<7; sys_platform == 'darwin'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
