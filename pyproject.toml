[project]
name = "agarose-gel-analyzer"
version = "0.0.1"
description = "A local agarose gel image viewer, built one capability at a time."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2,<3",
    "pillow>=11,<13",
    "streamlit>=1.65,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
