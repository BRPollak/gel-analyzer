  .st-key-gel_upload_start [data-testid="stFileUploaderDropzone"] { border: 1px dashed #a5bfc1; border-radius: 10px; background: #f4f9f8; }

  [data-testid="stImage"] img {
    max-width: 100%;

    object-fit: contain;
    object-position: center;

</style>
<span id="gel-viewport-controller" hidden></span>
<script>
(() => {
  if (window.gelPreviewViewport) {
    window.gelPreviewViewport.refresh();
    return;
  }
  const frameBudgets = new WeakMap();
  let scheduled = false;
  const viewportHeight = () => window.visualViewport?.height || window.innerHeight;
  const frameSelector = 'iframe[src*="well_line_overlay"], iframe[src*="lane_annotations"], iframe[src*="orientation_rectangle"]';

  // Leave downloads in the native window, but open the footer repository in
  // the default browser. The singleton guard above prevents duplicate handlers.
  document.addEventListener("click", event => {
    const link = event.target?.closest?.(".st-key-gel_footer a");
    if (link?.href !== "https://github.com/BRPollak/gel-analyzer"
        || typeof window.pywebview?.api?.open_repository !== "function") return;
    event.preventDefault();
    window.pywebview.api.open_repository();
  }, true);

  function availableHeight(element) {
    const workspace = element?.closest(".st-key-gel_workspace");
    const anchor = workspace || element?.closest('[data-testid="stElementContainer"]') || element;
    if (!anchor) return Math.max(1, viewportHeight() - 260);
    // Account for the title, upload control and filename at their natural page
    // position. Scroll and vertically centering a preview must not change its
    // budget, otherwise every frame-height update would shrink it again.
    const scroller = anchor.closest('[data-testid="stMain"]') || document.scrollingElement;
    const top = anchor.getBoundingClientRect().top + (scroller?.scrollTop || 0);
    let budget = Math.max(1, viewportHeight() - Math.max(64, top) - 28);
    if (workspace && window.innerWidth < 700) {
      const controls = workspace.querySelector(".st-key-gel_workflow_controls");
      budget = Math.max(1, budget - (controls?.getBoundingClientRect().height || 0) - 16);
    }
    return Math.floor(budget);
  }

  function refresh() {
    scheduled = false;
    document.querySelectorAll(".st-key-gel_workspace").forEach(workspace => {
      const scroller = workspace.closest('[data-testid="stMain"]') || document.scrollingElement;
      const top = workspace.getBoundingClientRect().top + (scroller?.scrollTop || 0);
      workspace.style.setProperty("--gel-workspace-height", `${Math.max(1, viewportHeight() - Math.max(64, top) - 28)}px`);
    });
    document.querySelectorAll('[data-testid="stImage"] img').forEach(img => {
      if (!img.complete || !img.naturalWidth) return;
      const container = img.closest('[data-testid="stElementContainer"]');
      const availableWidth = container?.clientWidth || img.parentElement.clientWidth;
      if (!availableWidth) return;
      const scale = Math.min(1, availableWidth / img.naturalWidth, availableHeight(img) / img.naturalHeight);
      img.style.width = `${img.naturalWidth * scale}px`;
      img.style.height = `${img.naturalHeight * scale}px`;
      img.dataset.previewScale = String(scale);
    });

    document.querySelectorAll(frameSelector).forEach(frame => {
      const height = availableHeight(frame);
      if (frameBudgets.get(frame) === height) return;
      frameBudgets.set(frame, height);
      frame.contentWindow?.postMessage({type: "gel:viewport", height}, "*");
    });
  }

  function schedule() {
    if (scheduled) return;
    scheduled = true;
    requestAnimationFrame(refresh);
  }
  // Observe sources and frame heights, not the styles this controller writes.
  const observer = new MutationObserver(schedule);
  observer.observe(document.body, {childList: true, subtree: true,
    attributes: true, attributeFilter: ["src", "height"]});
  document.addEventListener("load", event => {
    frameBudgets.delete(event.target);
    schedule();
  }, true);
  window.addEventListener("resize", schedule);
  window.visualViewport?.addEventListener("resize", schedule);
  window.addEventListener("message", event => {
    if (event.data?.isStreamlitMessage && event.data.type === "streamlit:setFrameHeight") schedule();
  });
  if (window.ResizeObserver) {
    new window.ResizeObserver(schedule).observe(document.body);
  }
  window.gelPreviewViewport = {refresh: schedule, availableHeight};
  schedule();
})();
</script>
