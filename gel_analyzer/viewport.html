<style>
  [data-testid="stElementContainer"]:has(#gel-viewport-controller) { display: none; }
  .stMainBlockContainer { padding-top: 3.5rem; padding-bottom: 1.5rem; }
  [data-testid="stHeadingWithActionElements"] h1 { font-size: 2rem; padding-top: 0; }
  .st-key-gel_upload_start { max-width: 760px; }
  .st-key-gel_workflow_controls [data-testid="stHeadingWithActionElements"] h3 {
    font-size: 1.2rem; padding-top: 0;
  }
  .st-key-gel_workflow_controls [data-testid="stButton"] button,
  .st-key-gel_workflow_controls [data-testid="stDownloadButton"] button { width: 100%; }
  .st-key-gel_workflow_controls [data-testid="stElementContainer"]:has([data-testid="stButton"]),
  .st-key-gel_workflow_controls [data-testid="stElementContainer"]:has([data-testid="stDownloadButton"]) { width: 100%; }
  @media (min-width: 400px) {
    :is(.st-key-gel_workspace, .st-key-gel_workspace > [data-testid="stLayoutWrapper"]) > [data-testid="stHorizontalBlock"] {
      align-items: flex-start; flex-wrap: nowrap;
    }
    :is(.st-key-gel_workspace, .st-key-gel_workspace > [data-testid="stLayoutWrapper"]) > [data-testid="stHorizontalBlock"] > [data-testid="stColumn"]:first-child {
      flex: 1 1 0; min-width: 0;
    }
    :is(.st-key-gel_workspace, .st-key-gel_workspace > [data-testid="stLayoutWrapper"]) > [data-testid="stHorizontalBlock"] > [data-testid="stColumn"]:last-child {
      flex: 0 0 clamp(180px, 26vw, 360px); min-width: 0; position: sticky; top: 4rem;
    }
  }
  @media (max-width: 399px) {
    :is(.st-key-gel_workspace, .st-key-gel_workspace > [data-testid="stLayoutWrapper"]) > [data-testid="stHorizontalBlock"] { flex-direction: column; gap: 1rem; }
    :is(.st-key-gel_workspace, .st-key-gel_workspace > [data-testid="stLayoutWrapper"]) > [data-testid="stHorizontalBlock"] > [data-testid="stColumn"] {
      width: 100%; flex: 1 1 100%; min-width: 0;
    }
  }
  [data-testid="stImage"] { max-width: 100%; }
  [data-testid="stImage"] img {
    max-width: 100%;
    max-height: calc(100dvh - 160px);
    object-fit: contain;
    object-position: left top;
    scroll-margin-top: 72px;
  }
</style>
<span id="gel-viewport-controller" hidden></span>
<script>
(() => {
  if (window.gelPreviewViewport) {
    window.gelPreviewViewport.refresh();
    return;
  }
  const seen = new WeakMap();
  let scheduled = false;
  const viewportHeight = () => window.visualViewport?.height || window.innerHeight;
  const isVisible = rect => rect.width > 0 && rect.height > 0;

  function revealOnce(element, identity, rect, scrollTarget = element) {
    if (!identity || !isVisible(rect) || seen.get(element) === identity) return;
    seen.set(element, identity);
    // Reveal a newly uploaded image or workflow stage once. Ordinary edits,
    // selections and reruns keep the user's focus and scroll position.
    if (rect.top < 64 || rect.bottom > viewportHeight() - 24) {
      scrollTarget.style.scrollMarginTop = "72px";
      scrollTarget.scrollIntoView({block: "start", behavior: "instant"});
    }
  }

  function refresh() {
    scheduled = false;
    document.querySelectorAll('[data-testid="stImage"] img').forEach(img => {
      if (!img.complete || !img.naturalWidth) return;
      const container = img.closest('[data-testid="stElementContainer"]');
      const availableWidth = container?.clientWidth || img.parentElement.clientWidth;
      if (!availableWidth) return;
      const scale = Math.min(1, availableWidth / img.naturalWidth,
        Math.max(1, viewportHeight() - 160) / img.naturalHeight);
      img.style.width = `${img.naturalWidth * scale}px`;
      img.style.height = `${img.naturalHeight * scale}px`;
      img.dataset.previewScale = String(scale);
      const workspace = img.closest(".st-key-gel_workspace");
      revealOnce(img, img.currentSrc || img.src, img.getBoundingClientRect(), workspace || img);
    });

    document.querySelectorAll('iframe[src*="well_line_overlay"], iframe[src*="lane_annotations"]').forEach(frame => {
      try {
        const doc = frame.contentDocument;
        const component = doc?.getElementById("component");
        const target = doc?.getElementById("preview-viewport") || doc?.getElementById("gel");
        const token = component?.dataset.token || target?.dataset.token;
        if (!token || !target || !component) return;
        const identity = `${token}:${component.dataset.ladderStep || ""}:${Boolean(doc.getElementById("group-panel")?.open)}`;
        const frameRect = frame.getBoundingClientRect();
        // Include the current step's controls and next action. Ladder and group
        // panels can grow while the image stays the same size.
        const localRect = component.getBoundingClientRect();
        // Wait for Streamlit to acknowledge the iframe's measured height.
        if (frameRect.height < component.getBoundingClientRect().height - 2 || !isVisible(localRect)) return;
        const rect = {width: localRect.width, height: localRect.height,
          top: frameRect.top + localRect.top, bottom: frameRect.top + localRect.bottom};
        revealOnce(frame, identity, rect, frame.closest(".st-key-gel_workspace") || frame);
      } catch { /* Cross-origin components handle their own preview sizing. */ }
    });
  }

  function schedule() {
    if (scheduled) return;
    scheduled = true;
    requestAnimationFrame(refresh);
  }
  // Observe sources and frame heights, not the styles this controller writes.
  const observer = new MutationObserver(schedule);
  observer.observe(document.body, {childList: true, subtree: true,
    attributes: true, attributeFilter: ["src", "height"]});
  document.addEventListener("load", schedule, true);
  window.addEventListener("resize", schedule);
  window.visualViewport?.addEventListener("resize", schedule);
  window.addEventListener("message", event => {
    if (event.data?.isStreamlitMessage && event.data.type === "streamlit:setFrameHeight") schedule();
  });
  window.gelPreviewViewport = {refresh: schedule};
  schedule();
})();
</script>
