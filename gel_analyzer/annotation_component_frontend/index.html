<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gel lane annotations</title>
  <style>
    :root { font-family: Arial, sans-serif; color-scheme: light; --text: #31333f; --panel: #f7f8fa; --border: #c9cdd4; --accent: #2563eb; }
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; color: var(--text); }
    #component { padding: 4px 0; font-size: 14px; }
    [hidden] { display: none !important; }
    p { line-height: 1.45; }
    .hint { margin: 7px 0; font-size: 12px; }
    .panel { border: 1px solid var(--border); border-radius: 7px; padding: 10px 12px; background: var(--panel); }
    .row { display: flex; flex-wrap: wrap; align-items: end; gap: 10px; }
    label.field { display: flex; flex-direction: column; gap: 5px; font-size: 13px; }
    .grow { flex: 1 1 220px; }
    input, select, button { font: inherit; }
    .panel input[type="text"], .panel input[type="number"], select { min-height: 34px; padding: 5px 8px; border: 1px solid var(--border); border-radius: 5px; background: white; color: #20242b; min-width: 0; }
    select { max-width: 100%; }
    button { min-height: 34px; border: 1px solid var(--border); border-radius: 5px; padding: 5px 10px; background: white; color: #20242b; cursor: pointer; }
    button:hover:not(:disabled) { border-color: var(--accent); }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    button:disabled, input:disabled, select:disabled { opacity: .6; cursor: default; }
    button[aria-pressed="true"] { color: #fff; background: var(--accent); border-color: var(--accent); }
    #bold { font-weight: bold; }
    #italic { font-style: italic; }
    #color { height: 34px; width: 40px; padding: 3px; border: 1px solid var(--border); border-radius: 5px; background: white; }
    #font-size { width: 80px; }
    #toolbar { display: flex; flex-wrap: wrap; gap: 7px 12px; align-items: center; margin-bottom: 8px; padding: 8px 10px; }
    #toolbar .field { flex-direction: row; align-items: center; gap: 6px; }
    #selection-name { font-size: 13px; min-width: 50px; }
    .formatting { display: flex; align-items: center; gap: 5px; }
    .font-family { margin-right: 3px; font-size: 13px; }
    .toolbar-end { display: flex; flex-wrap: wrap; gap: 7px; margin-left: auto; }
    #group-panel { margin-top: 12px; }
    #group-panel summary { cursor: pointer; font-size: 13px; font-weight: bold; }
    #group-panel summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    #group-panel[open] summary { margin-bottom: 12px; }
    #group-count { font-weight: normal; }
    #group-members { display: flex; gap: 7px 14px; flex-wrap: wrap; max-height: 140px; overflow: auto; margin-top: 8px; }
    #group-members label { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; min-height: 28px; }
    #group-members input { accent-color: var(--accent); }
    fieldset { margin: 10px 0 0; padding: 0; border: 0; min-width: 0; }
    legend { font-size: 13px; }
    #preview-viewport { width: 100%; overflow: auto; padding: 8px; border: 1px solid var(--border); border-radius: 6px; background: #e7e9ed; }
    #preview-viewport[data-fit="true"] { overflow: hidden; }
    #preview-space { position: relative; margin-inline: auto; overflow: hidden; overflow: clip; }
    #preview-stage { position: absolute; left: 0; top: 0; transform-origin: top left; background: white; }
    #preview { position: absolute; left: 0; top: 0; display: block; }
    #label-inputs { position: absolute; inset: 0; }
    .image-label { position: absolute; margin: 0; padding: 0; border: 1px dashed #94a3b8a8; border-radius: 2px; background: transparent; color: transparent; caret-color: var(--label-color, #000); text-align: right; box-sizing: content-box; cursor: text; }
    .image-label:hover { border-color: #2563eb; outline: 1px solid #2563eb; }
    .image-label[data-selected="true"] { outline: 2px solid #2563eb; outline-offset: 1px; }
    .image-label:focus { color: var(--label-color, #000); background: white; outline: 2px solid #2563eb; outline-offset: 1px; }
    .image-label::placeholder { color: #64748b; font-style: italic; }
    #confirm { color: white; background: #2563eb; border-color: #2563eb; font-weight: bold; }
    #actions { margin-top: 10px; align-items: center; justify-content: space-between; }
    #size-hint { margin: 0; }
    #status { margin: 9px 0 0; min-height: 20px; font-size: 13px; overflow-wrap: anywhere; }
    #status[data-error="true"] { color: #b42318; }
    #loading { margin: 8px 0; }
    @media (max-width: 540px) { .panel { padding: 10px; } .grow { flex-basis: 100%; } .toolbar-end { margin-left: 0; } #selection-name { min-width: 0; } }
  </style>
</head>
<body>
  <main id="component" data-preview-fit="screen">
    <p id="loading" role="status">Loading cropped gel…</p>
    <div id="editor" hidden>
      <div id="toolbar" class="panel" role="group" aria-label="Annotation formatting">
        <strong id="selection-name">Lane 1</strong>
        <div class="formatting" role="group" aria-label="Selected label formatting">
          <span class="font-family">Arial</span>
          <button id="bold" type="button" aria-label="Bold" aria-pressed="false" title="Bold">B</button>
          <button id="italic" type="button" aria-label="Italic" aria-pressed="false" title="Italic">I</button>
          <input id="color" type="color" value="#000000" aria-label="Text color" title="Text color">
        </div>
        <label class="field">Size<input id="font-size" type="number" min="1" max="4096" step="1" value="18" aria-label="Annotation font size" title="Font size for all annotations"></label>
        <button id="auto-size" type="button" title="80% of average lane height">Auto size</button>
        <label class="field">Zoom<select id="zoom" aria-label="Preview zoom"><option value="fit">Fit screen</option><option value="1">100%</option><option value="0.75">75%</option><option value="0.5">50%</option><option value="0.25">25%</option></select></label>
        <div class="toolbar-end">
          <button id="edit-selected-group" type="button" hidden>Edit group</button>
          <button id="open-groups" type="button">Add group</button>
        </div>
      </div>
      <p class="hint" id="editing-hint">Click a label to edit it. Use ↑ / ↓ to move between labels.</p>
      <div id="preview-viewport" tabindex="0" aria-label="Annotation preview; scroll to inspect the full image">
        <div id="preview-space"><div id="preview-stage">
          <canvas id="preview" role="img" aria-label="Live cropped gel with lane labels and group brackets"></canvas>
          <div id="label-inputs"></div>
        </div></div>
      </div>
      <div class="row" id="actions"><button id="confirm" type="button">Confirm annotations</button><p id="size-hint" class="hint"></p></div>
      <details id="group-panel" class="panel">
        <summary>Lane groups <span id="group-count">(0)</span></summary>
        <div class="row">
          <label class="field">Column<select id="group-set" aria-label="Group column"><option value="0">Set 1 · near lanes</option><option value="1">Set 2 · far left</option></select></label>
          <label class="field grow">Group<select id="group-select" aria-label="Group to edit"><option value="">New group</option></select></label>
          <label class="field grow" id="group-text-field">Group label<input id="group-text" type="text" maxlength="500" placeholder="Enter a group label" autocomplete="off" aria-label="Group label"></label>
          <button id="add-group" type="button">Create group</button>
          <button id="delete-group" type="button" hidden>Delete group</button>
        </div>
        <fieldset><legend>Lanes in this group</legend><div id="group-members"></div></fieldset>
        <p class="hint" id="group-hint">Choose a column, name the group, and select its lanes.</p>
      </details>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script type="module" src="editor.mjs"></script>
</body>
</html>
