name: Windows installer

on:
  workflow_dispatch:
    inputs:
      reuse_installer_run_id:
        description: "Optional build run ID: rerun native validation only, requiring identical application sources"
        required: false
        type: string
        default: ""
  push:
    branches: [codex/windows-installer, main]
    paths:
      - ".github/workflows/windows.yml"
      - "app.py"
      - "desktop_app.py"
      - "gel_analyzer/**"
      - "packaging/**"
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".streamlit/**"
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-regression:
    if: ${{ !inputs.reuse_installer_run_id }}
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
          enable-cache: true
      - name: Install locked desktop dependencies
        run: uv sync --locked --group desktop
      - name: Verify macOS desktop lifecycle
        run: uv run --locked --group desktop pytest -q tests/test_desktop.py tests/test_windows_runtime.py

  windows-tests:
    if: ${{ !inputs.reuse_installer_run_id }}
    name: Windows suites (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            artifact: windows-unit-tests
          - os: windows-2025
            artifact: windows-unit-tests-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked test dependencies
        run: uv sync --locked --group desktop --group build
      - name: Run Python and JavaScript suites
        run: |
          New-Item -ItemType Directory -Force build/windows | Out-Null
          uv run --locked --group desktop --group build pytest -q --junitxml=build/windows/pytest.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tests = Get-ChildItem tests -Filter "*.mjs" | ForEach-Object { $_.FullName }
          node --test $tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain Python test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/windows/pytest.xml
          if-no-files-found: warn
          retention-days: 30

  windows-current-install:
    name: Windows 2025 installed app
    needs: windows
    if: ${{ !cancelled() && needs.windows.outputs.installer_artifact_id != '' }}
    runs-on: windows-2025
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
          enable-cache: true
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist/windows
      - name: Install locked smoke dependencies
        run: |
          uv python install 3.12 --default
          uv sync --locked --group test-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --locked --group test-smoke python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify installer checksum and installed behavior on Windows 2025
        run: |
          $version = .venv/Scripts/python.exe -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $filename = "Gel-Analyzer-$version-Windows-x64-Setup.exe"
          $installer = Join-Path "dist/windows" $filename
          $checksums = @(Get-Content "dist/windows/SHA256SUMS-windows.txt")
          $expected = @($checksums | Where-Object { $_ -match ('^[0-9a-fA-F]{64}  ' + [regex]::Escape($filename) + '$') })
          if ($expected.Count -ne 1) { throw "Expected exactly one checksum for $filename" }
          $actual = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash
          if ($actual -ne $expected[0].Substring(0, 64)) { throw "Installer checksum does not match its build artifact" }
          ./scripts/test_windows_installer.ps1 -Installer $installer -Version $version -OutputDirectory "build/windows/installer-tests-2025"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain Windows 2025 installed app evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-validation-2025
          path: build/windows/installer-tests-2025/
          if-no-files-found: warn
          retention-days: 30

  windows:
    if: ${{ !inputs.reuse_installer_run_id }}
    runs-on: windows-2022
    timeout-minutes: 50
    outputs:
      installer_artifact_id: ${{ steps.retain-installer.outputs.artifact-id }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
          enable-cache: true
      - name: Install locked x64 build and test dependencies
        run: |
          uv python install 3.12 --default
          uv sync --locked --group desktop --group build --group test-smoke
          uv run --locked --group desktop --group build --group test-smoke python -c "import platform, struct; assert struct.calcsize('P') == 8 and platform.machine().lower() in ('amd64', 'x86_64'), 'x64 Python required'"
          uv run --locked --group desktop --group build --group test-smoke python -m playwright install chromium
      - name: Download Microsoft offline WebView2 prerequisite
        run: |
          New-Item -ItemType Directory -Force build/windows/prerequisites | Out-Null
          # Microsoft Evergreen Standalone Installer, x64 (not the online bootstrapper).
          curl.exe --fail --location --retry 3 --output build/windows/prerequisites/MicrosoftEdgeWebView2RuntimeInstallerX64.exe "https://go.microsoft.com/fwlink/?linkid=2124701"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and validate offline Windows installer
        run: |
          uv run --locked --group desktop --group build --group test-smoke python scripts/build_windows.py --webview2-installer build/windows/prerequisites/MicrosoftEdgeWebView2RuntimeInstallerX64.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain installer and checksums
        id: retain-installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/windows/*-Setup.exe
            dist/windows/SHA256SUMS-windows.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Build simulated earlier-version installer for upgrade testing
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=1.0.2" "/DAppDir=$pwd\dist\windows\Gel Analyzer" "/DOutputDir=$pwd\build\windows\upgrade-fixture" "/DWebView2Installer=$pwd\build\windows\prerequisites\MicrosoftEdgeWebView2RuntimeInstallerX64.exe" packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify install, upgrade, native window, exports, and uninstall
        run: |
          $version = .venv/Scripts/python.exe -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          ./scripts/test_windows_installer.ps1 -Installer "dist/windows/Gel-Analyzer-$version-Windows-x64-Setup.exe" -Version $version -PreviousInstaller "build/windows/upgrade-fixture/Gel-Analyzer-1.0.2-Windows-x64-Setup.exe" -OutputDirectory "build/windows/installer-tests"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain build and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-validation
          path: |
            build/windows/validation.json
            build/windows/installer-tests/
            build/windows/pyinstaller/**/warn-*.txt
          if-no-files-found: warn
          retention-days: 30

  native-reuse:
    name: Reused installer native validation (${{ matrix.os }})
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.reuse_installer_run_id != '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    env:
      SOURCE_RUN_ID: ${{ inputs.reuse_installer_run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate source run ID
        run: |
          if ($env:SOURCE_RUN_ID -notmatch '^[1-9][0-9]*$') { throw "Installer run ID must be a positive integer" }
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist/windows
          run-id: ${{ inputs.reuse_installer_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: windows-validation
          path: build/windows/source-validation
          run-id: ${{ inputs.reuse_installer_run_id }}
          github-token: ${{ github.token }}
      - name: Require identical application sources and verified installer
        run: |
          $ErrorActionPreference = "Stop"
          $report = Get-Content "build/windows/source-validation/validation.json" -Raw | ConvertFrom-Json
          $source = $report.git_commit
          if ($source -notmatch '^[0-9a-fA-F]{40}$') { throw "Build report has no valid source commit" }
          git fetch --no-tags --depth=1 origin $source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $changed = @(git diff --name-only $source HEAD --)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $productionChanges = @($changed | Where-Object {
            $_ -notmatch '^(\.github/|tests/|docs/)' -and
            $_ -notin @('scripts/smoke_windows.py', 'scripts/test_windows_installer.ps1')
          })
          if ($productionChanges.Count -gt 0) { throw "Application or build inputs changed: build a new installer instead of reusing this one. Changed paths: $($productionChanges -join ', ')" }
          $filename = $report.installer.filename
          $version = $report.version
          if ($version -notmatch '^\d+\.\d+\.\d+$' -or $filename -ne "Gel-Analyzer-$version-Windows-x64-Setup.exe") { throw "Unexpected installer identity in build report" }
          $installer = Join-Path "dist/windows" $filename
          $checksums = @(Get-Content "dist/windows/SHA256SUMS-windows.txt")
          $expected = @($checksums | Where-Object { $_ -match ('^[0-9a-fA-F]{64}  ' + [regex]::Escape($filename) + '$') })
          if ($expected.Count -ne 1) { throw "Expected exactly one installer checksum" }
          $actual = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash
          if ($actual -ne $expected[0].Substring(0, 64) -or $actual -ne $report.installer.sha256) { throw "Installer checksum differs from build evidence" }
          if ((Get-Item -LiteralPath $installer).Length -ne $report.installer.size_bytes) { throw "Installer size differs from build evidence" }
          New-Item -ItemType Directory -Force "build/windows/native-validation" | Out-Null
          [ordered]@{
            installer_run_id = $env:SOURCE_RUN_ID
            application_commit = $source
            harness_commit = $env:GITHUB_SHA
            installer = $filename
            installer_sha256 = $actual.ToLowerInvariant()
            identical_application_sources = $true
          } | ConvertTo-Json | Set-Content -Encoding utf8 "build/windows/native-validation/reused-installer.json"
          "REUSED_INSTALLER=$installer" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "REUSED_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
          enable-cache: true
      - name: Install locked smoke dependencies
        run: |
          uv python install 3.12 --default
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv sync --locked --group test-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --locked --group test-smoke python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify installed native app, dialogs, exports, and cleanup
        run: |
          ./scripts/test_windows_installer.ps1 -Installer $env:REUSED_INSTALLER -Version $env:REUSED_VERSION -OutputDirectory "build/windows/native-validation/installer-tests"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain native validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-validation-${{ matrix.os }}
          path: build/windows/native-validation/
          if-no-files-found: warn
          retention-days: 30
