name: Windows installer

on:
  workflow_dispatch:
  push:
    branches: [codex/windows-installer, main]
    paths:
      - ".github/workflows/windows.yml"
      - "app.py"
      - "desktop_app.py"
      - "gel_analyzer/**"
      - "packaging/**"
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".streamlit/**"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-regression:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
          enable-cache: true
      - name: Install locked desktop dependencies
        run: uv sync --locked --group desktop
      - name: Verify macOS desktop lifecycle
        run: uv run --locked --group desktop pytest -q tests/test_desktop.py tests/test_windows_runtime.py

  windows:
    runs-on: windows-2022
    timeout-minutes: 50
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked x64 build and test dependencies
        run: |
          uv python install 3.12 --default
          uv sync --locked --group desktop --group build --group test-smoke
          uv run --locked --group desktop --group build --group test-smoke python -c "import platform, struct; assert struct.calcsize('P') == 8 and platform.machine().lower() in ('amd64', 'x86_64'), 'x64 Python required'"
          uv run --locked --group desktop --group build --group test-smoke python -m playwright install chromium
      - name: Run Python and JavaScript suites
        run: |
          New-Item -ItemType Directory -Force build/windows | Out-Null
          uv run --locked --group desktop --group build --group test-smoke pytest -q --junitxml=build/windows/pytest.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tests = Get-ChildItem tests -Filter "*.mjs" | ForEach-Object { $_.FullName }
          node --test $tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Download Microsoft offline WebView2 prerequisite
        run: |
          New-Item -ItemType Directory -Force build/windows/prerequisites | Out-Null
          # Microsoft Evergreen Standalone Installer, x64 (not the online bootstrapper).
          curl.exe --fail --location --retry 3 --output build/windows/prerequisites/MicrosoftEdgeWebView2RuntimeInstallerX64.exe "https://go.microsoft.com/fwlink/?linkid=2124701"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and validate offline Windows installer
        run: |
          uv run --locked --group desktop --group build --group test-smoke python scripts/build_windows.py --webview2-installer build/windows/prerequisites/MicrosoftEdgeWebView2RuntimeInstallerX64.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build simulated earlier-version installer for upgrade testing
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=1.0.2" "/DAppDir=$pwd\dist\windows\Gel Analyzer" "/DOutputDir=$pwd\build\windows\upgrade-fixture" "/DWebView2Installer=$pwd\build\windows\prerequisites\MicrosoftEdgeWebView2RuntimeInstallerX64.exe" packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify install, upgrade, native window, exports, and uninstall
        run: |
          $version = .venv/Scripts/python.exe -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          ./scripts/test_windows_installer.ps1 -Installer "dist/windows/Gel-Analyzer-$version-Windows-x64-Setup.exe" -Version $version -PreviousInstaller "build/windows/upgrade-fixture/Gel-Analyzer-1.0.2-Windows-x64-Setup.exe" -OutputDirectory "build/windows/installer-tests"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain verified installer and checksums
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/windows/*-Setup.exe
            dist/windows/SHA256SUMS-windows.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Retain build and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-validation
          path: |
            build/windows/validation.json
            build/windows/pytest.xml
            build/windows/installer-tests/
            build/windows/pyinstaller/**/warn-*.txt
          if-no-files-found: warn
          retention-days: 30
